<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width">
    <title>ランダムでライバーを表示するあれこれ</title>
    <link rel="stylesheet" type="text/css" href="./css/bootstrap.css">
    <link rel="stylesheet" type="text/css" href="./css/style.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.1/jquery.min.js"></script>
    <script src="./js/bootstrap.js"></script>
    <script src="./js/script.js"></script>
</head>

<body>
    <header>
        <h1>ランダムでライバーを表示するあれこれ</h1>
    </header>

    <div id="main" class="main">
        <div class="main-innner">
            <h2 class="main-innner-ttl">グループ選択</h2>
            <div class="wrap-box">
                <p>※チェックが付いてるライバーの中からランダムで表示します</p>
                <div id="groupArea"></div>
            </div>
        </div>
        <div class="main-innner">
            <h2 class="main-innner-ttl">メンバー選択（除外したい人のチェックを外す）</h2>
            <div class="wrap-box">
                <div id="memberArea"></div>
            </div>
        </div>

        <div class="clickChoose_area">
            <p class="clickChoose_head">＼クリックで1人抽選／</p>
            <button class="clickChoose_btn" id="pickBtn">抽選！</button>
        </div>

        <div class="main-innner result-area">
            <h2 class="main-innner-ttl">結果表示</h2>
            <div class="wrap-box">
                <div id="result"></div>
                <button id="tweetBtn">X に投稿する</button>
            </div>
        </div>
    </div>

    <footer>
        <p>作った人：仮な</p>
        <p><a href="/random-liver/nijiko_random.html">疑似にじさんじ甲子園ドラフト用</a></p>
    </footer>
</body>

</html>
